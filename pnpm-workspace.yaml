packages:
  - "packages/*"
  - "apps/*"

# pnpm 11 blocks postinstall scripts unless a package is listed here. These four need theirs:
# Prisma downloads its query engine, esbuild its platform binary. Both are first-party scripts
# from the packages themselves, and nothing works without them.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  esbuild: true
